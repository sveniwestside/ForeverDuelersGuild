name: Tests

# Runs on every push and pull request. Publication is a separate, gated
# workflow (curseforge-release.yml); nothing here uses secrets.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            tools/requirements-analysis.txt

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt -r tools/requirements-analysis.txt

      - name: Lua addon suites (Lua 5.1)
        run: python tests/run.py

      - name: Release and export tooling tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Analysis tooling tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'

      - name: Web tests
        run: npm test
